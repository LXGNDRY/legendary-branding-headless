# Dependabot configuration for Legendary Branding Headless
# Weekly cadence, opens PRs for dependency updates.
# All deps are exact-pinned — dependabot bumps the pinned version.

version: 2
updates:
  # npm packages
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Group all non-major patches together for less PR noise
      patch-updates:
        dependency-type: "production"
        update-types: ["patch"]
      dev-patch-updates:
        dependency-type: "development"
        update-types: ["patch"]
      hydrogen-ecosystem:
        patterns:
          - "@shopify/*"
          - "react-router"
          - "@react-router/*"
          - "tailwindcss"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(deps-actions)"
