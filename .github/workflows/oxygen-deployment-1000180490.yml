# Don't change the line below!
#! oxygen_storefront_id: 1000180490

name: Storefront 1000180490

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  actions: read

concurrency:
  group: ${{ github.ref }}-deployment
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  quality:
    name: Quality Gate (codegen + typecheck + lint + test + build)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          check-latest: false

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify Storefront API credentials
        run: node scripts/validate-storefront-token.mjs
        env:
          PUBLIC_STORE_DOMAIN: ${{ secrets.PUBLIC_STORE_DOMAIN }}
          PUBLIC_STOREFRONT_API_TOKEN: ${{ secrets.PUBLIC_STOREFRONT_API_TOKEN }}
          # Only genuinely untrusted PRs (Dependabot or a fork) ever have
          # repo secrets withheld by GitHub -- a push to dev/main or a
          # same-repo PR with missing credentials means real
          # misconfiguration and must fail here rather than skip.
          ALLOW_CREDENTIAL_SKIP: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}

      - name: Codegen + GraphQL validation (Storefront & Customer Account)
        run: npm run codegen
        env:
          PUBLIC_STORE_DOMAIN: ${{ secrets.PUBLIC_STORE_DOMAIN }}
          PUBLIC_STOREFRONT_API_TOKEN: ${{ secrets.PUBLIC_STOREFRONT_API_TOKEN }}
          SESSION_SECRET: ci-only-do-not-use

      - name: Reject generated GraphQL drift
        run: |
          test -n "$(git ls-files storefrontapi.generated.d.ts customer-accountapi.generated.d.ts)"
          git diff --exit-code -- \
            storefrontapi.generated.d.ts \
            customer-accountapi.generated.d.ts
          test "$(wc -c < storefrontapi.generated.d.ts)" -gt 1000

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (with coverage floor)
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: ignore

      - name: Check locale catalogs
        run: npm run locales:check

  deploy:
    name: Deploy to Oxygen
    # Preview deploys automatically on every push to dev. Production deploys
    # automatically on every push to main (i.e. every merged release PR),
    # matching CLAUDE.md's documented pipeline -- a manual workflow_dispatch
    # on main is also supported as a fallback (e.g. to redeploy without a
    # new commit).
    if: >-
      (github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main')) ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main')
    needs: [quality, e2e]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          check-latest: false

      - name: Cache node modules
        id: cache-npm-deploy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate production environment contract
        if: github.ref_name == 'main'
        run: npm run validate:release-env
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          PUBLIC_STORE_DOMAIN: ${{ secrets.PUBLIC_STORE_DOMAIN }}
          PUBLIC_STOREFRONT_API_TOKEN: ${{ secrets.PUBLIC_STOREFRONT_API_TOKEN }}
          PUBLIC_STOREFRONT_ID: ${{ secrets.PUBLIC_STOREFRONT_ID }}
          PUBLIC_CHECKOUT_DOMAIN: ${{ secrets.PUBLIC_CHECKOUT_DOMAIN }}
          PUBLIC_CUSTOMER_ACCOUNT_API_CLIENT_ID: ${{ secrets.PUBLIC_CUSTOMER_ACCOUNT_API_CLIENT_ID }}
          PUBLIC_CUSTOMER_ACCOUNT_API_URL: ${{ secrets.PUBLIC_CUSTOMER_ACCOUNT_API_URL }}
          PUBLIC_GA4_MEASUREMENT_ID: ${{ secrets.PUBLIC_GA4_MEASUREMENT_ID }}
          PRIVATE_KLAVIYO_API_KEY: ${{ secrets.PRIVATE_KLAVIYO_API_KEY }}
          PUBLIC_KLAVIYO_LIST_ID: ${{ secrets.PUBLIC_KLAVIYO_LIST_ID }}

      - name: Require executed E2E evidence for production
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --pattern 'e2e-summary-*' --dir e2e-gate
          COUNT=$(find e2e-gate -name 'e2e-summary-*.json' | wc -l)
          if [ "$COUNT" -lt 4 ] || ! find e2e-gate -name 'e2e-summary-*.json' | xargs jq -e -s 'all(.ran == true and .expected > 0 and .unexpected == 0)' >/dev/null; then
            echo "::error::Production deploys require all four E2E projects to have executed tests (found $COUNT summaries)."
            find e2e-gate -name 'e2e-summary-*.json' -exec cat {} \;
            exit 1
          fi

      - name: Build and Publish to Oxygen
        id: deploy
        run: |
          npx shopify hydrogen deploy \
            --force \
            --json-output \
            --auth-bypass-token \
            --auth-bypass-token-duration=1 \
            --env-branch "$GITHUB_REF_NAME"

          test -s h2_deploy_log.json
          DEPLOY_URL=$(jq -er '.url | select(type == "string" and startswith("https://"))' h2_deploy_log.json)
          AUTH_BYPASS_TOKEN=$(jq -er '.authBypassToken | select(type == "string" and length > 0)' h2_deploy_log.json)

          echo "::add-mask::$AUTH_BYPASS_TOKEN"
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
          echo "AUTH_BYPASS_TOKEN=$AUTH_BYPASS_TOKEN" >> "$GITHUB_ENV"
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000180490 }}
          # NOTE: baked into the worker at build time so /api/release can prove which commit is serving.
          VITE_RELEASE_SHA: ${{ github.sha }}

      - name: Post-deploy smoke test
        run: |
          echo "Running smoke tests against: $DEPLOY_URL"
          BROWSER_UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          FAILURES=0
          TOTAL=0

          check_route() {
            local path="$1"
            local label="$2"
            local markers=("${@:3}")
            local outfile
            outfile="$(mktemp)"
            TOTAL=$((TOTAL + 1))

            local result status final_url
            result=$(curl --fail-with-body -s -o "$outfile" -w "%{http_code}|%{url_effective}" -L --max-time 30 \
              -H "User-Agent: $BROWSER_UA" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
              -H "oxygen-auth-bypass-token: $AUTH_BYPASS_TOKEN" \
              "$DEPLOY_URL$path") || result="000|$DEPLOY_URL$path"
            status="${result%%|*}"
            final_url="${result#*|}"

            echo "$label: HTTP $status ($final_url)"

            if echo "$final_url" | grep -q "accounts.shopify.com" || grep -qi "verifying your connection" "$outfile" 2>/dev/null; then
              echo "  FAIL: authentication bypass did not reach the Oxygen deployment"
              FAILURES=$((FAILURES + 1))
              rm -f "$outfile"
              return
            fi

            if ! echo "$status" | grep -q "^2"; then
              echo "  FAIL: $label returned $status"
              FAILURES=$((FAILURES + 1))
            elif grep -qi "something went wrong\|unexpected error occurred\|server error" "$outfile" 2>/dev/null; then
              echo "  FAIL: $label contains error boundary text"
              FAILURES=$((FAILURES + 1))
            else
              # NOTE: a 200 is not enough -- each route must also contain content that proves the right page rendered.
              local marker
              for marker in "${markers[@]}"; do
                if ! grep -Eq "$marker" "$outfile" 2>/dev/null; then
                  echo "  FAIL: $label is missing expected content: $marker"
                  FAILURES=$((FAILURES + 1))
                fi
              done
            fi
            rm -f "$outfile"
          }

          TITLE_MARKER='<title[^>]*>[^<]*LEGENDARY BRANDING'
          # NOTE: resource titles honor Shopify SEO overrides, including the merchant's casing.
          RESOURCE_TITLE_MARKER='<title[^>]*>[[:space:]]*[^[:space:]<][^<]*</title>'

          check_route "/" "Homepage" "$TITLE_MARKER"
          check_route "/collections/all-products" "All products" "$RESOURCE_TITLE_MARKER" '"@type":"CollectionPage"' 'rel="canonical" href="https://legendary-branding[.]com/collections/all-products"' 'href="/products/'
          check_route "/cart" "Cart" "$TITLE_MARKER"
          check_route "/policies/about" "About policy" "$TITLE_MARKER"
          check_route "/sitemap.xml" "Sitemap" '<urlset' '<loc>https://'
          # NOTE: Oxygen preview hosts deliberately serve `Disallow: /` with no Sitemap line (see app/lib/robots.ts), so only the file's shape is checked.
          check_route "/robots.txt" "Robots" '^User-agent:'

          # Discover a real PDP handle from the storefront at runtime so this
          # smoke test remains valid when catalog products change.
          PRODUCT_OUT="$(mktemp)"
          PRODUCT_RESULT=$(curl --fail-with-body -s -o "$PRODUCT_OUT" -w "%{http_code}" -L --max-time 30 \
            -H "User-Agent: $BROWSER_UA" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "oxygen-auth-bypass-token: $AUTH_BYPASS_TOKEN" \
            "$DEPLOY_URL/collections/all-products") || PRODUCT_RESULT="000"
          PRODUCT_PATH=$(grep -oE 'href="/products/[^"]+"' "$PRODUCT_OUT" | head -n 1 | cut -d '"' -f 2 || true)
          if echo "$PRODUCT_RESULT" | grep -q "^2" && [ -n "$PRODUCT_PATH" ]; then
            check_route "$PRODUCT_PATH" "Product detail" "$RESOURCE_TITLE_MARKER" '"@type":"Product"' 'rel="canonical" href="https://legendary-branding[.]com/products/'
          else
            echo "Product detail: FAIL (could not discover a product path from all-products)"
            FAILURES=$((FAILURES + 1))
            TOTAL=$((TOTAL + 1))
          fi
          rm -f "$PRODUCT_OUT"

          # Exercise the same-origin Shopify proxy used by Hydrogen consent and
          # analytics, not only storefront page routes.
          GRAPHQL_OUT="$(mktemp)"
          TOTAL=$((TOTAL + 1))
          GRAPHQL_STATUS=$(curl -sS -o "$GRAPHQL_OUT" -w "%{http_code}" -L --max-time 30 \
            -X POST \
            -H "User-Agent: $BROWSER_UA" \
            -H "Content-Type: application/json" \
            -H "oxygen-auth-bypass-token: $AUTH_BYPASS_TOKEN" \
            --data '{"query":"{ shop { name } }"}' \
            "$DEPLOY_URL/api/unstable/graphql.json") || GRAPHQL_STATUS="000"
          if [ "$GRAPHQL_STATUS" != "200" ] || ! jq -e '.errors == null and (.data.shop.name | type == "string" and length > 0)' "$GRAPHQL_OUT" >/dev/null 2>&1; then
            echo "Storefront GraphQL proxy: FAIL (HTTP $GRAPHQL_STATUS)"
            FAILURES=$((FAILURES + 1))
          else
            echo "Storefront GraphQL proxy: HTTP $GRAPHQL_STATUS"
          fi
          rm -f "$GRAPHQL_OUT"

          echo ""
          if [ "$FAILURES" -gt 0 ]; then
            echo "SMOKE TEST FAILED: $FAILURES/$TOTAL route(s) returned real errors"
            exit 1
          fi

          echo "All smoke tests passed ($TOTAL/$TOTAL routes verified)"

      - name: Verify deployed commit and runtime environment contract
        run: |
          RELEASE_OUT="$(mktemp)"
          STATUS=$(curl -sS -o "$RELEASE_OUT" -w "%{http_code}" --max-time 30 \
            -H "oxygen-auth-bypass-token: $AUTH_BYPASS_TOKEN" \
            "$DEPLOY_URL/api/release") || STATUS="000"
          echo "Release endpoint: HTTP $STATUS"
          jq -c . "$RELEASE_OUT" || true
          if [ "$STATUS" != "200" ] || ! jq -e --arg sha "$GITHUB_SHA" '.ok == true and .missing == 0 and .sha == $sha' "$RELEASE_OUT" >/dev/null; then
            echo "::error::Deployed worker is not the reviewed commit ($GITHUB_SHA) or its runtime environment is incomplete"
            exit 1
          fi

      - name: Capture SEO post-release baseline (production only)
        if: github.ref_name == 'main'
        run: |
          mkdir -p release-evidence
          OUT="release-evidence/seo-postrelease-baseline.json"
          # Give the edge a moment to settle on the new worker before probing live.
          sleep 15
          if ! node scripts/seo-postrelease-baseline.mjs \
            --origin https://legendary-branding.com \
            --release-sha "$GITHUB_SHA" \
            --out "$OUT"; then
            echo "::error::SEO post-release baseline FAILED -- see $OUT"
            cat "$OUT" || true
            exit 1
          fi
          {
            echo "### SEO post-release baseline"
            echo '```json'
            cat "$OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect E2E execution summaries
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --pattern 'e2e-summary-*' --dir e2e-summaries

      - name: Record release evidence
        if: always()
        run: |
          mkdir -p release-evidence
          E2E=$(find e2e-summaries -name 'e2e-summary-*.json' 2>/dev/null | xargs -r jq -s '.' 2>/dev/null || true)
          E2E=${E2E:-[]}
          jq -n \
            --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF_NAME" --arg run "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" --arg url "${DEPLOY_URL:-}" \
            --arg lock "$(sha256sum package-lock.json | cut -d' ' -f1)" \
            --arg outcome "${{ job.status }}" \
            --argjson e2e "$E2E" \
            '{sha:$sha, ref:$ref, run:$run, attempt:$attempt, deployUrl:$url, lockfileSha256:$lock, outcome:$outcome, e2e:$e2e}' \
            | tee release-evidence/release.json
          {
            echo "### Release evidence"
            echo '```json'
            cat release-evidence/release.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence/release.json
          if-no-files-found: ignore

      - name: Identify last healthy deploy
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # NOTE: recovery is a normal PR/CI revert to this SHA — never a manual deploy or force-push.
          LAST=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/oxygen-deployment-1000180490.yml/runs?branch=$GITHUB_REF_NAME&event=push&status=success&per_page=1" --jq '.workflow_runs[0] | "\(.head_sha) (run \(.id))"' 2>/dev/null || true)
          echo "::error::Deploy verification failed. Last healthy deploy on $GITHUB_REF_NAME: ${LAST:-unknown}"

  e2e:
    name: E2E Tests (${{ matrix.project }})
    needs: quality
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # NOTE: Playwright's official image ships the browsers and their system
    # libraries, so no apt downloads at job time (Ubuntu mirror stalls
    # previously cancelled whole E2E jobs). The tag must equal the exact
    # @playwright/test version in package.json -- bump both together.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: webkit
            browser: webkit
          - project: mobile
            browser: chromium
          - project: mobile-safari
            browser: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          check-latest: false

      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify Storefront API credentials
        id: verify-creds
        run: node scripts/validate-storefront-token.mjs
        env:
          PUBLIC_STORE_DOMAIN: ${{ secrets.PUBLIC_STORE_DOMAIN }}
          PUBLIC_STOREFRONT_API_TOKEN: ${{ secrets.PUBLIC_STOREFRONT_API_TOKEN }}
          # Only genuinely untrusted PRs (Dependabot or a fork) ever have
          # repo secrets withheld by GitHub -- a push to dev/main or a
          # same-repo PR with missing credentials means real
          # misconfiguration and must fail here rather than skip the whole
          # E2E matrix and let an unvalidated build through.
          ALLOW_CREDENTIAL_SKIP: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}

      # GitHub never grants repository secrets to Dependabot-authored or
      # forked pull_request runs (a platform restriction, not a bug) --
      # PUBLIC_STORE_DOMAIN/PUBLIC_STOREFRONT_API_TOKEN come through empty,
      # the local preview server 500s on every request, and Playwright's
      # webServer never comes up, timing out the whole job 20 minutes later
      # with a misleading "Timed out waiting 120000ms" instead of the real
      # cause. The credentials step above already detects and skips this
      # case in seconds; skip the rest of the job the same way instead of
      # letting it run toward a guaranteed, uninformative timeout.
      - name: Report E2E skipped (no Storefront API credentials available)
        if: steps.verify-creds.outputs.skipped == 'true'
        run: echo "::notice::Skipping E2E — no Storefront API credentials available to this run (expected for Dependabot/fork PRs)."

      # Runs even when E2E is skipped (Dependabot/fork PRs), so a
      # @playwright/test bump without a matching image bump fails its PR.
      - name: Verify container ships this Playwright version's browsers
        run: |
          node -e '
            const fs = require("fs");
            const pw = require("playwright-core");
            const version = require("@playwright/test/package.json").version;
            const exe = pw["${{ matrix.browser }}"].executablePath();
            if (!fs.existsSync(exe)) {
              console.log(`::error::@playwright/test ${version} expects ${exe}, which this container lacks. Set the E2E container image to mcr.microsoft.com/playwright:v${version}-noble.`);
              process.exit(1);
            }
            console.log(`Playwright ${version}: ${exe}`);
          '

      # `shopify hydrogen preview` (and `dev`) load env vars via Miniflare
      # from a local `.env` file — they do NOT read inherited shell/step
      # `env:` vars the way a plain Node script (like codegen) does. Without
      # this, the preview server 500s on every request with "SESSION_SECRET
      # environment variable is not set" even though the step below sets it.
      - name: Create .env for local preview server
        if: steps.verify-creds.outputs.skipped != 'true'
        run: |
          cat > .env <<EOF
          SESSION_SECRET=ci-only-do-not-use
          PUBLIC_STORE_DOMAIN=${{ secrets.PUBLIC_STORE_DOMAIN }}
          PUBLIC_STOREFRONT_API_TOKEN=${{ secrets.PUBLIC_STOREFRONT_API_TOKEN }}
          EOF

      - name: Build
        if: steps.verify-creds.outputs.skipped != 'true'
        run: npm run build

      # Runs against a local `shopify hydrogen preview` server (see
      # playwright.config.ts's webServer), not the live Oxygen preview URL.
      # Shopify's Oxygen preview (*.myshopify.dev) domains intercept
      # automated browser traffic — including real Chromium — with a
      # "Verifying your connection..." bot-check, which previously made
      # every single E2E test fail regardless of the actual app's health.
      # Testing a locally-served production build sidesteps that entirely
      # and removes the dependency on a live deploy succeeding first.
      # NOTE: Mini-Oxygen's worker fetches static assets from its own assets
      # server via `http://localhost:<port>`. In a job container /etc/hosts
      # maps localhost to ::1 too, but the container network has no IPv6,
      # so every CSS/JS/font request 500s and pages render unstyled. Pin
      # localhost to IPv4 (/etc/hosts is bind-mounted, so rewrite in place).
      - name: Resolve localhost to IPv4 inside the container
        run: |
          grep -vE '^\s*::1\s' /etc/hosts > /tmp/hosts.ipv4
          cat /tmp/hosts.ipv4 > /etc/hosts
          getent hosts localhost

      - name: Run E2E tests against local production build
        if: steps.verify-creds.outputs.skipped != 'true'
        run: npm run test:e2e -- --project=${{ matrix.project }} --workers=1 --reporter=github,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results.json

      # NOTE: a green job is not proof tests ran (Dependabot/fork runs skip E2E), so every run records what was
      # executed, skipped and retried; the deploy job aggregates these into the release evidence.
      - name: Summarize E2E execution
        if: always()
        env:
          E2E_PROJECT: ${{ matrix.project }}
          E2E_CREDS_SKIPPED: ${{ steps.verify-creds.outputs.skipped }}
        # NOTE: node, not jq -- the Playwright container image does not ship jq.
        run: |
          mkdir -p e2e-summary
          node -e '
            const fs = require("fs");
            const project = process.env.E2E_PROJECT;
            const base = {project, ran: false, expected: 0, skipped: 0, unexpected: 0, flaky: 0};
            let summary;
            if (process.env.E2E_CREDS_SKIPPED === "true") {
              summary = {...base, reason: "no Storefront API credentials"};
            } else if (fs.existsSync("e2e-results.json")) {
              const {stats} = JSON.parse(fs.readFileSync("e2e-results.json", "utf8"));
              summary = {project, ran: true, expected: stats.expected, skipped: stats.skipped, unexpected: stats.unexpected, flaky: stats.flaky, durationMs: stats.duration};
            } else {
              summary = {...base, reason: "no results file"};
            }
            fs.writeFileSync(`e2e-summary/e2e-summary-${project}.json`, JSON.stringify(summary));
            console.log(JSON.stringify(summary));
          '

      - name: Upload E2E execution summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-summary-${{ matrix.project }}
          path: e2e-summary/e2e-summary-${{ matrix.project }}.json
          if-no-files-found: warn

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-traces-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
