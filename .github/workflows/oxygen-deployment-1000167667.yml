# Don't change the line below!
#! oxygen_storefront_id: 1000167667

name: Storefront 1000167667

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: ${{ github.ref }}-deployment
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate (codegen + typecheck + lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          check-latest: false

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Codegen + GraphQL validation (Storefront & Customer Account)
        run: npm run codegen
        env:
          PUBLIC_STORE_DOMAIN: ${{ secrets.PUBLIC_STORE_DOMAIN }}
          PUBLIC_STOREFRONT_API_TOKEN: ${{ secrets.PUBLIC_STOREFRONT_API_TOKEN }}
          SESSION_SECRET: ci-only-do-not-use

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  deploy:
    name: Deploy to Oxygen
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dev')
    needs: quality
    timeout-minutes: 30
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          check-latest: false

      - name: Cache node modules
        id: cache-npm-deploy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build and Publish to Oxygen
        id: deploy
        run: |
          npx shopify hydrogen deploy --force
          # Capture the Oxygen preview URL from the deploy log so downstream
          # steps/jobs (smoke test, E2E) can target the correct deployment.
          if [ -f h2_deploy_log.json ]; then
            DEPLOY_URL=$(node -e "
              const log = require('./h2_deploy_log.json');
              // Try common paths for the deployment URL
              const url = log.url || log.previewUrl || log.deploy_url || (log.deployment && log.deployment.url) || (log.deployments && log.deployments[0] && log.deployments[0].url) || '';
              process.stdout.write(url);
            " 2>/dev/null || echo "")
            echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
            echo "Deploy URL extracted: $DEPLOY_URL"
          else
            echo "h2_deploy_log.json not found — smoke test / E2E may not have a target URL"
          fi
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000167667 }}

      - name: Post-deploy smoke test
        if: steps.deploy.outputs.url != ''
        run: |
          DEPLOY_URL="${{ steps.deploy.outputs.url }}"
          echo "Running smoke tests against: $DEPLOY_URL"

          # Shopify's Oxygen preview (*.myshopify.dev) URLs sometimes intercept
          # automated/non-browser requests with a bot-check interstitial
          # ("Verifying your connection...", redirecting to
          # accounts.shopify.com/select) instead of serving the app. This is
          # infrastructure-level behavior outside the app's control — hammering
          # the URL with rapid repeated requests (as a tight retry loop does)
          # appears to make it more likely to trigger, not less. So: use a
          # realistic browser User-Agent on every request, wait once instead of
          # polling aggressively, and treat the bot-check page as INCONCLUSIVE
          # rather than a hard failure — only real app-level errors (5xx,
          # unexpected 404, or the app's own error-boundary text on a page that
          # is NOT the challenge page) fail the job.
          BROWSER_UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

          echo "Waiting for deployment to settle..."
          sleep 10

          FAILURES=0
          INCONCLUSIVE=0
          TOTAL=0

          check_route() {
            local path="$1"
            local label="$2"
            local outfile
            outfile="$(mktemp)"
            TOTAL=$((TOTAL + 1))

            local result status final_url
            result=$(curl -s -o "$outfile" -w "%{http_code}|%{url_effective}" -L --max-time 20 \
              -H "User-Agent: $BROWSER_UA" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
              "$DEPLOY_URL$path")
            status="${result%%|*}"
            final_url="${result#*|}"

            echo "$label: HTTP $status ($final_url)"

            if echo "$final_url" | grep -q "accounts.shopify.com" || grep -qi "verifying your connection" "$outfile" 2>/dev/null; then
              echo "  INCONCLUSIVE: intercepted by Shopify's bot-check / verification challenge — not an app error, cannot verify via curl"
              INCONCLUSIVE=$((INCONCLUSIVE + 1))
              rm -f "$outfile"
              return
            fi

            if ! echo "$status" | grep -q "^2"; then
              echo "  FAIL: $label returned $status"
              FAILURES=$((FAILURES + 1))
            elif grep -qi "something went wrong\|unexpected error occurred\|server error" "$outfile" 2>/dev/null; then
              echo "  FAIL: $label contains error boundary text"
              FAILURES=$((FAILURES + 1))
            fi
            rm -f "$outfile"
          }

          check_route "/" "Homepage"
          check_route "/collections/all-products" "All products"
          check_route "/policies/about" "About policy"
          check_route "/sitemap.xml" "Sitemap"
          check_route "/robots.txt" "Robots"

          echo ""
          if [ "$FAILURES" -gt 0 ]; then
            echo "SMOKE TEST FAILED: $FAILURES/$TOTAL route(s) returned real errors"
            exit 1
          fi

          if [ "$INCONCLUSIVE" -gt 0 ]; then
            echo "::warning::Post-deploy smoke test: $INCONCLUSIVE/$TOTAL route(s) were intercepted by Shopify's Oxygen preview bot-check and could not be verified automatically. This is a known infrastructure limitation, not a sign of an application error. Manually verify $DEPLOY_URL in a browser if in doubt."
            echo "SMOKE TEST INCONCLUSIVE: $INCONCLUSIVE/$TOTAL route(s) could not be verified (Shopify bot-check), 0 confirmed failures"
            exit 0
          fi

          echo "All smoke tests passed (0 failures, 0 inconclusive, $TOTAL/$TOTAL routes verified)"

  e2e:
    name: E2E Tests (Playwright)
    needs: quality
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          check-latest: false

      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          PUBLIC_STORE_DOMAIN: ${{ secrets.PUBLIC_STORE_DOMAIN }}
          PUBLIC_STOREFRONT_API_TOKEN: ${{ secrets.PUBLIC_STOREFRONT_API_TOKEN }}
          SESSION_SECRET: ci-only-do-not-use

      # Runs against a local `shopify hydrogen preview` server (see
      # playwright.config.ts's webServer), not the live Oxygen preview URL.
      # Shopify's Oxygen preview (*.myshopify.dev) domains intercept
      # automated browser traffic — including real Chromium — with a
      # "Verifying your connection..." bot-check, which previously made
      # every single E2E test fail regardless of the actual app's health.
      # Testing a locally-served production build sidesteps that entirely
      # and removes the dependency on a live deploy succeeding first.
      - name: Run E2E tests against local production build
        run: npm run test:e2e -- --project=chromium
        env:
          PUBLIC_STORE_DOMAIN: ${{ secrets.PUBLIC_STORE_DOMAIN }}
          PUBLIC_STOREFRONT_API_TOKEN: ${{ secrets.PUBLIC_STOREFRONT_API_TOKEN }}
          SESSION_SECRET: ci-only-do-not-use

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: playwright-report/
          retention-days: 7
