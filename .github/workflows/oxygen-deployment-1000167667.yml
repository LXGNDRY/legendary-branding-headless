# Don't change the line below!
#! oxygen_storefront_id: 1000167667

name: Storefront 1000167667

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: ${{ github.ref }}-deployment
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate (codegen + typecheck + lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          check-latest: false

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Codegen + GraphQL validation (Storefront & Customer Account)
        run: npm run codegen
        env:
          PUBLIC_STORE_DOMAIN: ${{ secrets.PUBLIC_STORE_DOMAIN }}
          PUBLIC_STOREFRONT_API_TOKEN: ${{ secrets.PUBLIC_STOREFRONT_API_TOKEN }}
          SESSION_SECRET: ci-only-do-not-use

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  deploy:
    name: Deploy to Oxygen
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dev')
    needs: quality
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          check-latest: false

      - name: Cache node modules
        id: cache-npm-deploy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build and Publish to Oxygen
        id: deploy
        run: npx shopify hydrogen deploy --force
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000167667 }}

      - name: Post-deploy smoke test
        if: steps.deploy.outputs.url != ''
        run: |
          DEPLOY_URL="${{ steps.deploy.outputs.url }}"
          echo "Running smoke tests against: $DEPLOY_URL"

          # Wait for deployment to be reachable
          for i in $(seq 1 15); do
            if curl -s -o /dev/null -w "%{http_code}" "$DEPLOY_URL" | grep -q "200"; then
              echo "Deployment is reachable"
              break
            fi
            echo "Waiting for deployment... ($i/15)"
            sleep 4
          done

          FAILURES=0

          # Route 1: Homepage
          STATUS=$(curl -s -o /tmp/homepage.html -w "%{http_code}" "$DEPLOY_URL/")
          echo "Homepage: HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "  FAIL: homepage returned $STATUS"
            FAILURES=$((FAILURES + 1))
          elif grep -qi "something went wrong\|unexpected error occurred\|server error" /tmp/homepage.html; then
            echo "  FAIL: homepage contains error boundary text"
            FAILURES=$((FAILURES + 1))
          fi

          # Route 2: Collections listing / all products
          STATUS=$(curl -s -o /tmp/all-products.html -w "%{http_code}" "$DEPLOY_URL/collections/all-products")
          echo "All products: HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "  FAIL: all-products returned $STATUS"
            FAILURES=$((FAILURES + 1))
          elif grep -qi "something went wrong\|unexpected error occurred\|server error" /tmp/all-products.html; then
            echo "  FAIL: all-products contains error boundary text"
            FAILURES=$((FAILURES + 1))
          fi

          # Route 3: Policies/about
          STATUS=$(curl -s -o /tmp/about.html -w "%{http_code}" "$DEPLOY_URL/policies/about")
          echo "About policy: HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "  FAIL: about policy returned $STATUS"
            FAILURES=$((FAILURES + 1))
          elif grep -qi "something went wrong\|unexpected error occurred\|server error" /tmp/about.html; then
            echo "  FAIL: about policy contains error boundary text"
            FAILURES=$((FAILURES + 1))
          fi

          # Route 4: Sitemap
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOY_URL/sitemap.xml")
          echo "Sitemap: HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "  FAIL: sitemap returned $STATUS"
            FAILURES=$((FAILURES + 1))
          fi

          # Route 5: robots.txt
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOY_URL/robots.txt")
          echo "Robots: HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "  FAIL: robots.txt returned $STATUS"
            FAILURES=$((FAILURES + 1))
          fi

          if [ "$FAILURES" -gt 0 ]; then
            echo ""
            echo "SMOKE TEST FAILED: $FAILURES route(s) returned errors"
            exit 1
          fi

          echo ""
          echo "All smoke tests passed ($FAILURES failures)"

  e2e:
    name: E2E Tests (Playwright)
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dev')
    needs: deploy
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          check-latest: false

      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests against deployed preview
        run: npm run test:e2e -- --project=chromium
        env:
          BASE_URL: ${{ needs.deploy.outputs.url }}

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: playwright-report/
          retention-days: 7
