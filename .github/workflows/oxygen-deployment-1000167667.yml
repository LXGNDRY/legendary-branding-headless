# Don't change the line below!
#! oxygen_storefront_id: 1000167667

name: Storefront 1000167667

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: ${{ github.ref }}-deployment
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate (codegen + typecheck + lint + test + build)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          check-latest: false

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Codegen + GraphQL validation (Storefront & Customer Account)
        run: npm run codegen
        env:
          PUBLIC_STORE_DOMAIN: ${{ secrets.PUBLIC_STORE_DOMAIN }}
          PUBLIC_STOREFRONT_API_TOKEN: ${{ secrets.PUBLIC_STOREFRONT_API_TOKEN }}
          SESSION_SECRET: ci-only-do-not-use

      - name: Reject generated GraphQL drift
        run: |
          git diff --exit-code -- \
            storefrontapi.generated.d.ts \
            customeraccountapi.generated.d.ts

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  deploy:
    name: Deploy to Oxygen
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dev')
    needs: quality
    timeout-minutes: 30
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          check-latest: false

      - name: Cache node modules
        id: cache-npm-deploy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build and Publish to Oxygen
        id: deploy
        run: |
          npx shopify hydrogen deploy \
            --force \
            --json-output \
            --auth-bypass-token \
            --auth-bypass-token-duration=1 \
            --env-branch "$GITHUB_REF_NAME"

          test -s h2_deploy_log.json
          DEPLOY_URL=$(jq -er '.url | select(type == "string" and startswith("https://"))' h2_deploy_log.json)
          AUTH_BYPASS_TOKEN=$(jq -er '.authBypassToken | select(type == "string" and length > 0)' h2_deploy_log.json)

          echo "::add-mask::$AUTH_BYPASS_TOKEN"
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
          echo "AUTH_BYPASS_TOKEN=$AUTH_BYPASS_TOKEN" >> "$GITHUB_ENV"
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000167667 }}

      - name: Post-deploy smoke test
        run: |
          echo "Running smoke tests against: $DEPLOY_URL"
          BROWSER_UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          FAILURES=0
          TOTAL=0

          check_route() {
            local path="$1"
            local label="$2"
            local outfile
            outfile="$(mktemp)"
            TOTAL=$((TOTAL + 1))

            local result status final_url
            result=$(curl --fail-with-body -s -o "$outfile" -w "%{http_code}|%{url_effective}" -L --max-time 30 \
              -H "User-Agent: $BROWSER_UA" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
              -H "oxygen-auth-bypass-token: $AUTH_BYPASS_TOKEN" \
              "$DEPLOY_URL$path") || result="000|$DEPLOY_URL$path"
            status="${result%%|*}"
            final_url="${result#*|}"

            echo "$label: HTTP $status ($final_url)"

            if echo "$final_url" | grep -q "accounts.shopify.com" || grep -qi "verifying your connection" "$outfile" 2>/dev/null; then
              echo "  FAIL: authentication bypass did not reach the Oxygen deployment"
              FAILURES=$((FAILURES + 1))
              rm -f "$outfile"
              return
            fi

            if ! echo "$status" | grep -q "^2"; then
              echo "  FAIL: $label returned $status"
              FAILURES=$((FAILURES + 1))
            elif grep -qi "something went wrong\|unexpected error occurred\|server error" "$outfile" 2>/dev/null; then
              echo "  FAIL: $label contains error boundary text"
              FAILURES=$((FAILURES + 1))
            fi
            rm -f "$outfile"
          }

          check_route "/" "Homepage"
          check_route "/collections/all-products" "All products"
          check_route "/policies/about" "About policy"
          check_route "/sitemap.xml" "Sitemap"
          check_route "/robots.txt" "Robots"

          echo ""
          if [ "$FAILURES" -gt 0 ]; then
            echo "SMOKE TEST FAILED: $FAILURES/$TOTAL route(s) returned real errors"
            exit 1
          fi

          echo "All smoke tests passed ($TOTAL/$TOTAL routes verified)"

  e2e:
    name: E2E Tests (${{ matrix.project }})
    needs: quality
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit, mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          check-latest: false

      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # `shopify hydrogen preview` (and `dev`) load env vars via Miniflare
      # from a local `.env` file — they do NOT read inherited shell/step
      # `env:` vars the way a plain Node script (like codegen) does. Without
      # this, the preview server 500s on every request with "SESSION_SECRET
      # environment variable is not set" even though the step below sets it.
      - name: Create .env for local preview server
        run: |
          cat > .env <<EOF
          SESSION_SECRET=ci-only-do-not-use
          PUBLIC_STORE_DOMAIN=${{ secrets.PUBLIC_STORE_DOMAIN }}
          PUBLIC_STOREFRONT_API_TOKEN=${{ secrets.PUBLIC_STOREFRONT_API_TOKEN }}
          EOF

      - name: Build
        run: npm run build

      # Runs against a local `shopify hydrogen preview` server (see
      # playwright.config.ts's webServer), not the live Oxygen preview URL.
      # Shopify's Oxygen preview (*.myshopify.dev) domains intercept
      # automated browser traffic — including real Chromium — with a
      # "Verifying your connection..." bot-check, which previously made
      # every single E2E test fail regardless of the actual app's health.
      # Testing a locally-served production build sidesteps that entirely
      # and removes the dependency on a live deploy succeeding first.
      - name: Run E2E tests against local production build
        run: npm run test:e2e -- --project=${{ matrix.project }} --workers=1

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-traces-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
